<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B1+ Vocabulary & Look / Look Like Homework</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eaf0f6;color:#1c2d43;font:21px/1.55 system-ui,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d9e2ec;padding:13px max(18px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px}.brand{font-weight:800;color:#2a5377}.counter{color:#61748a}.slide{max-width:1140px;margin:20px auto;background:#fff;border-radius:22px;padding:clamp(22px,4.5vw,55px);min-height:76vh;box-shadow:0 9px 28px #24466510}.kicker{font-size:15px;font-weight:800;color:#b4557d;letter-spacing:.1em}h1{font-size:clamp(34px,4.4vw,54px);line-height:1.15;margin:12px 0 26px}h3{font-size:27px;color:#264d70;margin:26px 0 10px}.lead{font-size:25px;font-weight:500}.note{background:#fdf1f5;border-left:5px solid #c3668b;padding:18px 22px;border-radius:12px;margin-top:22px}.task{display:flex;gap:20px;background:#f2f6fb;border-radius:16px;padding:20px;margin:16px 0}.num{font-weight:800;color:#bd6386;font-size:23px}.taskmain{flex:1;min-width:0}.task p{margin:0 0 14px}.task textarea{width:100%;min-height:90px;resize:vertical;padding:14px;font:inherit;border:1.5px solid #c2cfdd;border-radius:12px;background:white}.task details{margin-top:12px;color:#245277}.task details p{margin-top:12px}summary{cursor:pointer;font-weight:750}.hint{font-size:17px;color:#60758a}.grammar{background:#f5f8fc;padding:20px 28px;border-radius:17px}.example{background:#fff;border-left:4px solid #79a8d5;padding:12px 18px;margin:12px 0;font-weight:700}.example small{display:block;color:#66798c;font-weight:400;font-size:17px}.mcq{background:#f2f6fb;border-radius:16px;padding:20px;margin:17px 0}.options{display:flex;gap:10px;flex-wrap:wrap}.options button{border:1px solid #b9cadc;background:#fff;color:#20466b;padding:12px 17px;border-radius:12px;font:inherit;cursor:pointer}.options button.selected.correct{background:#d9f3e5;border-color:#2c9865}.options button.selected.wrong{background:#ffe0e4;border-color:#d36171}.feedback{font-size:18px;margin-top:10px}.download,nav button{background:#2b567e;color:white;border:0;border-radius:13px;padding:13px 20px;font:inherit;cursor:pointer}.download{font-weight:700;font-size:23px}.muted{font-size:17px;color:#6b7c8c}nav{max-width:1140px;margin:10px auto 30px;padding:0 15px;display:flex;justify-content:space-between;align-items:center;gap:15px}nav button:disabled{opacity:.35}.progress{height:5px;background:#d9e5f0}.progress>div{height:100%;background:#bd6386;transition:width .2s}@media(max-width:650px){body{font-size:19px}.slide{margin:0;border-radius:0;padding:22px 17px;min-height:calc(100dvh - 135px)}header{padding:10px 14px;font-size:14px}h1{font-size:35px}.lead{font-size:22px}.task{padding:14px;gap:10px}.num{font-size:19px}.grammar{padding:15px}.options{display:grid;grid-template-columns:1fr}.options button{text-align:left}.example small{font-size:16px}nav{margin:0;background:#fff;position:sticky;bottom:0;padding:10px 14px;border-top:1px solid #d9e2ec}nav button{padding:10px 14px;font-size:17px}}</style></head><body><header><div class="brand">B1+ · Vocabulary & Grammar</div><div class="counter" id="counter"></div></header><div class="progress"><div id="progress"></div></div><main id="app"></main><nav><button id="prev">← Назад</button><span>HOMEWORK</span><button id="next">Далее →</button></nav><script>const slides=[{"title": "Not every statement is equally reliable", "kicker": "CRITICAL THINKING · REPHRASE", "content": "<p class=\"lead\">Rewrite each claim to make it more accurate and less exaggerated. Use the suggested expression.</p><article class=\"task\"><span class=\"num\">16</span><div class=\"taskmain\"><p>“Everyone who works remotely becomes more productive.” Use A GROWING NUMBER OF.</p><textarea data-key=\"16\" aria-label=\"Answer 16\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>A growing number of people work remotely, but this does not necessarily make everyone more productive.</p></details></div></article><article class=\"task\"><span class=\"num\">17</span><div class=\"taskmain\"><p>“She is definitely a genius because she remembers every phone number.” Use SUFFICIENT EVIDENCE.</p><textarea data-key=\"17\" aria-label=\"Answer 17\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>There is not sufficient evidence to believe that she is a genius simply because she remembers phone numbers.</p></details></div></article><article class=\"task\"><span class=\"num\">18</span><div class=\"taskmain\"><p>“He speaks five languages perfectly.” You know he only speaks two well. Use EXAGGERATE.</p><textarea data-key=\"18\" aria-label=\"Answer 18\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>The article exaggerated how fluent he was in several languages.</p></details></div></article>"}, {"title": "Look and look like: основное различие", "kicker": "GRAMMAR · RULE 1", "content": "<div class=\"grammar\"><h3>1. LOOK + adjective</h3><p>Используем <b>look + прилагательное</b>, когда говорим, <b>каким человек или предмет выглядит</b>. После look здесь не нужен предлог like.</p><div class=\"example\">You look tired.<small>Вы выглядите уставшим.</small></div><div class=\"example\">The room looks spacious.<small>Комната выглядит просторной.</small></div><p><b>Не:</b> <s>She looks like nervous.</s> → <b>She looks nervous.</b></p><h3>2. LOOK LIKE + noun / noun phrase</h3><p>Используем <b>look like + существительное или именную группу</b>, когда говорим, <b>на кого или на что похож человек или предмет</b>.</p><div class=\"example\">He looks like his grandfather.<small>Он похож на своего дедушку.</small></div><div class=\"example\">This building looks like a castle.<small>Это здание похоже на замок.</small></div><p><b>Не:</b> <s>He looks a doctor.</s> → <b>He looks like a doctor.</b></p></div>"}, {"title": "Look like + clause и look at", "kicker": "GRAMMAR · RULE 2", "content": "<div class=\"grammar\"><h3>3. LOOK LIKE + целое предложение</h3><p>В разговорной речи <b>It looks like + подлежащее + сказуемое</b> означает «Похоже, что…». Это предположение на основе того, что мы видим.</p><div class=\"example\">It looks like the train is going to be late.<small>Похоже, поезд опоздает.</small></div><div class=\"example\">She looks like she hasn't slept well.<small>Похоже, она плохо спала.</small></div><h3>4. LOOK AT — действие, а не впечатление</h3><p><b>Look at</b> означает «смотреть на». Если мы описываем, <b>как выполняется действие</b>, используем наречие.</p><div class=\"example\">He looked carefully at the photograph.<small>Он внимательно посмотрел на фотографию.</small></div><div class=\"example\">He looked worried in the photograph.<small>На фотографии он выглядел обеспокоенным.</small></div><h3>5. Вопросы и отрицания</h3><p>What does she <b>look like</b>? — Как она выглядит (опишите внешность)?</p><p>How does she <b>look</b>? — Как она выглядит / каково её состояние?</p><p>He <b>doesn't look</b> angry. / He <b>doesn't look like</b> his brother.</p></div>"}, {"title": "Choose the correct form", "kicker": "GRAMMAR · 10 QUESTIONS", "content": "<p class=\"lead\">Выберите один правильный вариант. После ответа появится объяснение.</p><div class=\"mcq\" data-correct=\"0\"><p><b>1.</b> The interviewer ___ interested in my answer.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looked</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looked like</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looked at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"1\"><p><b>2.</b> That cloud ___ a giant bird.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looks</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looks like</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looks at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"1\"><p><b>3.</b> She ___ she has just received good news.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looks</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looks like</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looks at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"2\"><p><b>4.</b> The researcher ___ the old document carefully.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looked</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looked like</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looked at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"1\"><p><b>5.</b> The new office ___ much brighter than the old one.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looks like</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looks</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looks at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"1\"><p><b>6.</b> What does your new neighbour ___?</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">look</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">look like</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">look at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"0\"><p><b>7.</b> The cake ___ something from a professional bakery.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looks like</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looks</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looks at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"1\"><p><b>8.</b> He ___ completely relaxed during the interview.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looked like</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looked</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looked at</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"2\"><p><b>9.</b> It ___ the shop is closed today.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looks at</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looks</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looks like</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div><div class=\"mcq\" data-correct=\"0\"><p><b>10.</b> The technician ___ the screen closely before answering.</p><div class=\"options\"><button type=\"button\" data-choice=\"0\" onclick=\"choose(this)\">looked at</button><button type=\"button\" data-choice=\"1\" onclick=\"choose(this)\">looked like</button><button type=\"button\" data-choice=\"2\" onclick=\"choose(this)\">looked</button></div><div class=\"feedback\" aria-live=\"polite\" data-explain=\"{html.escape(explain,quote=True)}\"></div></div>"}, {"title": "Make the distinction yourself", "kicker": "GRAMMAR · PRODUCTION", "content": "<p class=\"lead\">Переведите на английский. Используйте <b>look, look like</b> или <b>look at</b>.</p><article class=\"task\"><span class=\"num\">19</span><div class=\"taskmain\"><p>Эта фотография выглядит необычно.</p><textarea data-key=\"19\" aria-label=\"Answer 19\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>This photograph looks unusual.</p></details></div></article><article class=\"task\"><span class=\"num\">20</span><div class=\"taskmain\"><p>Это здание похоже на старую фабрику.</p><textarea data-key=\"20\" aria-label=\"Answer 20\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>This building looks like an old factory.</p></details></div></article><article class=\"task\"><span class=\"num\">21</span><div class=\"taskmain\"><p>Похоже, они готовятся к важной встрече.</p><textarea data-key=\"21\" aria-label=\"Answer 21\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>It looks like they are preparing for an important meeting.</p></details></div></article><article class=\"task\"><span class=\"num\">22</span><div class=\"taskmain\"><p>Она внимательно посмотрела на результаты.</p><textarea data-key=\"22\" aria-label=\"Answer 22\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>She looked carefully at the results.</p></details></div></article><article class=\"task\"><span class=\"num\">23</span><div class=\"taskmain\"><p>На кого похож Ваш новый коллега?</p><textarea data-key=\"23\" aria-label=\"Answer 23\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>What does your new colleague look like?</p></details></div></article><article class=\"task\"><span class=\"num\">24</span><div class=\"taskmain\"><p>Он не выглядит уверенным.</p><textarea data-key=\"24\" aria-label=\"Answer 24\" placeholder=\"Write your answer in English…\"></textarea><details><summary>Show suggested answer</summary><p>He doesn’t look confident.</p></details></div></article>"}, {"title": "Check your progress", "kicker": "FINISH · DOWNLOAD", "content": "<p class=\"lead\">Вы завершили повторение лексики и грамматики.</p><p>Скачайте ответы одним текстовым файлом, чтобы отправить преподавателю. Тестовые ответы также попадут в файл.</p><button class=\"download\" onclick=\"downloadAnswers()\">↓ Download my answers (.txt)</button><p class=\"muted\">Ответы сохраняются автоматически в браузере на этом устройстве.</p>"}];let current=0;const key='b1plus_vocabulary_look_homework_slides5to10_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function store(){document.querySelectorAll('textarea[data-key]').forEach(x=>saved['a'+x.dataset.key]=x.value);localStorage.setItem(key,JSON.stringify(saved))}function show(n){store();current=Math.max(0,Math.min(n,slides.length-1));let s=slides[current];document.querySelector('#app').innerHTML='<section class="slide"><div class="kicker">'+s.kicker+'</div><h1>'+s.title+'</h1>'+s.content+'</section>';document.querySelector('#counter').textContent=(current+1)+' / '+slides.length;document.querySelector('#progress').style.width=((current+1)/slides.length*100)+'%';document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelectorAll('textarea[data-key]').forEach(x=>{x.value=saved['a'+x.dataset.key]||'';x.addEventListener('input',store)});document.querySelectorAll('.mcq').forEach((q,i)=>{let id='q'+i;let choice=saved[id];if(choice!==undefined){let btn=q.querySelector('[data-choice="'+choice+'"]');if(btn)choose(btn,true)}});window.scrollTo(0,0)}function choose(btn,restoring=false){let q=btn.closest('.mcq'),val=Number(btn.dataset.choice),correct=Number(q.dataset.correct);q.querySelectorAll('button').forEach(b=>{b.classList.remove('selected','correct','wrong');b.disabled=true});btn.classList.add('selected',val===correct?'correct':'wrong');q.querySelector('.feedback').textContent=(val===correct?'✓ Верно. ':'✗ Попробуйте учесть правило. ') + q.querySelector('.feedback').dataset.explain;let i=[...document.querySelectorAll('.mcq')].indexOf(q);saved['q'+i]=val;if(!restoring)localStorage.setItem(key,JSON.stringify(saved))}function downloadAnswers(){store();let lines=['B1+ Vocabulary and LOOK / LOOK LIKE — Homework','',...Object.keys(saved).filter(k=>k.startsWith('a')).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1))).map(k=>'Task '+k.slice(1)+': '+saved[k]),'', 'Multiple choice answers:',...Object.keys(saved).filter(k=>k.startsWith('q')).map(k=>k+': option '+(Number(saved[k])+1))];let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='B1plus_homework_answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);</script></body></html>
